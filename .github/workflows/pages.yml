# Publishes the standalone tutor to GitHub Pages on every push to main.
# The site is static: web/ (the main page, browser Python, service worker) plus the files Python loads.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: |
          python web/files.py
          mkdir _site
          cp -r web store tests tutor index.html _site/
          find _site -name "__pycache__" -prune -exec rm -rf {} +
          find _site -name "*.db" -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
