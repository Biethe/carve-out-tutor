{% extends "base.html" %}
{% block title %}Sign up — Polyvault{% endblock %}
{% block content %}
<form class="panel narrow" method="post" action="/signup">
  <h1>Create an account</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label>Username <input name="username" value="{{ username }}" autocomplete="username" required></label>
  <label>Password <input name="password" type="password" autocomplete="new-password" required minlength="6"></label>
  <label>Confirm password <input name="confirm" type="password" autocomplete="new-password" required minlength="6"></label>
  <button class="btn">Sign up</button>
  <p class="switch">Already have an account? <a href="/login">Log in</a></p>
</form>
{% endblock %}
