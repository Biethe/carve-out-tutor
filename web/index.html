<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carve-Out Tutor</title>
  <meta name="description" content="Learn to code by rebuilding small pieces of apps that already work. Runs entirely in your browser.">
  <link rel="stylesheet" href="../tutor/static/style.css">
  <style>
    #tutor { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    .boot { min-height: calc(100dvh - 70px); display: grid; place-content: center; justify-items: center; gap: 16px; text-align: center; }
    .boot p { margin: 0; max-width: 40ch; }
  </style>
</head>
<body>
  <!-- This page owns browser Python. The tutor runs inside it, in the frame, with no server anywhere. -->
  <div id="intro" class="screen" hidden></div>
  <section id="boot" hidden>
    <header class="top gut"><span class="brand"><span class="chip xs" data-chip></span>Carve-Out</span></header>
    <main class="boot gut screen">
      <span class="chip lg busy" id="boot-chip" data-chip></span>
      <p class="say md" id="boot-say" role="status">Getting Python ready…</p>
      <p class="muted">Everything runs in your browser. The first visit downloads Python once, so it takes a little longer.</p>
      <button class="btn" id="boot-retry" hidden>Try again</button>
    </main>
  </section>
  <iframe id="tutor" title="Carve-Out Tutor" allow="microphone; autoplay" hidden></iframe>
  <script src="../tutor/static/chip.js"></script>
  <script src="../tutor/static/story.js"></script>
  <script src="python.js"></script>
  <script>
    const frame = document.getElementById("tutor"), boot = document.getElementById("boot");

    function open() {
      frame.src = "tutor/" + location.hash.slice(1);  // #learn reopens the workspace after a reload
      frame.hidden = false;
      frame.onload = () => {
        boot.hidden = true;
        // Keep the address bar in step with the tutor page, so reloading comes back to it.
        const page = frame.contentWindow.location.pathname.split("/tutor/")[1] || "";
        history.replaceState(null, "", page ? "#" + page : location.pathname);
        document.title = frame.contentDocument.title;
      };
    }
    function showFailure(err) {
      document.getElementById("boot-say").textContent = "Python couldn’t start: " + err.message;
      document.getElementById("boot-chip").classList.remove("busy");
      const retry = document.getElementById("boot-retry");
      retry.hidden = false;
      retry.onclick = () => location.reload();
    }

    // First visit: the story plays while Python loads. Later visits: Chip waits with you. The tutor opens once both are done.
    const intro = document.getElementById("intro");
    let ready = false, told = Story.seen(), failed = null;
    function next() {
      if (!told) return;
      intro.hidden = true;
      if (ready) return open();
      boot.hidden = false;
      if (failed) showFailure(failed);
    }
    if (told) next(); else Story.play(intro, { python: true, voice: "../tutor/static/voice/", onDone() { told = true; next(); } });
    Python.start().then(() => { ready = true; Story.python("ready"); next(); })
      .catch((err) => { failed = err; Story.python("failed"); next(); });
  </script>
</body>
</html>
