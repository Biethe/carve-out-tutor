<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace — Carve-Out Tutor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="workspace-body">
  <header class="top">
    <a class="brand" href="/">Carve-Out Tutor</a>
    <span class="round" id="round"></span>
    <div class="ownership" title="Share of the project's lines of code you wrote">
      <span>Your code</span>
      <div class="bar"><div class="fill" id="own-fill"></div></div>
      <strong id="own-pct">0%</strong>
    </div>
  </header>
  <main class="workspace">
    <section class="left">
      <div class="panel" id="task">
        <div class="tabs" role="tablist">
          <button class="tab active" role="tab" aria-selected="true" aria-controls="tab-task" id="tab-btn-task">Your task</button>
          <button class="tab" role="tab" aria-selected="false" aria-controls="tab-read" id="tab-btn-read">Read first</button>
        </div>
        <div id="tab-task" role="tabpanel">
          <p class="step-label" id="step-label"></p>
          <h1><code id="fn-signature"></code></h1>
          <p id="fn-description"></p>
          <h2>To pass, it must</h2>
          <ul class="criteria" id="criteria"></ul>
          <p class="muted small">Write just this function in the editor. Imports go right above it.</p>
        </div>
        <div id="tab-read" role="tabpanel" hidden>
          <h2>Where it's used</h2>
          <ul id="task-calls"></ul>
          <h2>What breaks if it's wrong</h2>
          <p id="task-breaks"></p>
          <h2>Code to read</h2>
          <div id="task-refs"></div>
        </div>
      </div>
    </section>
    <section class="right">
      <div class="editor-wrap"><textarea id="editor" spellcheck="false"></textarea></div>
      <div class="toolbar">
        <button class="btn" id="submit">Submit</button>
        <button class="btn secondary" id="hint">Hint</button>
        <button class="btn secondary" id="run">Run project</button>
        <button class="btn" id="next" hidden>Next function →</button>
        <span class="save-state" id="save-state"></span>
      </div>
      <p class="status" id="run-status"></p>
      <div class="panel results" id="results">
        <p class="muted">Write your code, then click <strong>Submit</strong> to run the tests.</p>
      </div>
    </section>
  </main>
  <button class="tutor-fab" id="tutor-fab" title="Drag me anywhere. Click to open the tutor." aria-expanded="false" aria-controls="tutor-win">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
    <span>Tutor</span>
  </button>
  <section class="tutor-win" id="tutor-win" hidden aria-label="Tutor">
    <header>
      <strong>Tutor</strong>
      <span class="tutor-mode" id="tutor-mode">Hints</span>
      <button class="close" id="tutor-close" aria-label="Close tutor">×</button>
    </header>
    <div class="messages" id="messages"></div>
    <form class="chat" id="chat">
      <textarea id="chat-input" rows="2" placeholder="Ask about a library, a method, or a concept…"></textarea>
      <div class="chat-buttons">
        <button class="btn" id="explain" type="button" hidden>Send answer</button>
        <button class="btn secondary" id="ask" type="button">Ask</button>
      </div>
    </form>
  </section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="/static/run.js"></script>
  <script src="/static/learn.js"></script>
</body>
</html>
